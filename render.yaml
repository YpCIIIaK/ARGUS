envVarGroups:
  - name: argus-search-auth
    envVars:
      - key: SEARXNG_TOKEN
        generateValue: true

services:
  - type: web
    name: forumds
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: TIME_ZONE
        value: Asia/Qyzylorda
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: CSB_API_KEY
        sync: false
      - key: ROUTER_ENABLED
        value: "true"
      - key: SEARXNG_URL
        value: https://argus-search.onrender.com
      - fromGroup: argus-search-auth
      - key: DATABASE_URL
        sync: false
      - key: BOUNTY_CHANNEL_ID
        sync: false
      - key: BOUNTY_MONITOR_URL
        sync: false
      - key: BOUNTY_MONITOR_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: openrouter/auto
      - key: AUTONOMOUS_ENABLED
        value: "false"

  - type: web
    name: argus-search
    runtime: docker
    plan: free
    dockerfilePath: ./search-service/Dockerfile
    dockerContext: ./search-service
    healthCheckPath: /health
    envVars:
      - fromGroup: argus-search-auth
      - key: SEARXNG_SECRET
        generateValue: true
