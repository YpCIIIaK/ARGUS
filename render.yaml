services:
  - type: web
    name: forumds
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOUNTY_CHANNEL_ID
        sync: false
      - key: BOUNTY_MONITOR_URL
        sync: false
      - key: BOUNTY_MONITOR_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: openrouter/auto
      - key: AUTONOMOUS_ENABLED
        value: "false"
